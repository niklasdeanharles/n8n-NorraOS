name: 'n8n Deploy'

# Pushes committed workflow definitions back to the n8n instance.
on:
  push:
    branches:
      - main
    paths:
      - n8n-workflows/**
      - scripts/**
      - supabase/migrations/**
      - .github/workflows/n8n-deploy.yml
  pull_request:
    paths:
      - n8n-workflows/**
      - scripts/**
      - supabase/migrations/**
      - .github/workflows/n8n-deploy.yml
  workflow_dispatch:

concurrency:
  # Never let two deploys race the same instance.
  group: norra-n8n-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Push workflows
    runs-on: ubuntu-latest
    # A pull request only ever gets the dry run below, so a fork cannot reach
    # the live instance.
    environment: ${{ github.event_name == 'push' && 'production' || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'

      - name: Validate workflow JSON
        working-directory: n8n-workflows
        run: |
          set -euo pipefail
          for file in *.json; do
            node -e "
              const wf = require('./$file');
              if (!wf.name) throw new Error('$file has no name');
              if (!Array.isArray(wf.nodes)) throw new Error('$file has no nodes array');
              if (!wf.norra?.workflowId) throw new Error('$file has no norra.workflowId');
            "
            echo "ok  $file"
          done

      # Without the frontend checked out this covers workflows against the
      # schema only; the app-side half runs in the frontend repository, which
      # is where app changes actually land.
      - name: Check workflows and schema still agree
        run: node scripts/check-wiring.mjs

      - name: Dry run
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: node scripts/n8n-sync.mjs deploy --dry-run

      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: node scripts/n8n-sync.mjs deploy
