name: "Norra: Secrets Check"

# Beantwortet genau eine Frage: welche Repository-Secrets erreichen einen Job
# in diesem Repository tatsaechlich? Die Werte bleiben aussen vor -- GitHub
# maskiert sie ohnehin, und fehlen tun hier die Namen, nicht die Werte.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/norra-secrets-check.yml'

permissions:
  contents: read

jobs:
  arriving-secrets:
    if: github.repository == 'niklasdeanharles/n8n-NorraOS'
    runs-on: ubuntu-latest
    steps:
      - name: Namen der ankommenden Secrets
        env:
          AVAILABLE: ${{ toJSON(secrets) }}
        run: |
          names=$(printf '%s' "$AVAILABLE" | grep -o '"[^"]*"[[:space:]]*:' | tr -d '":[:space:]' | sort)
          echo "Angekommene Secrets:"
          printf '%s\n' "$names" | sed 's/^/  - /'
          echo
          echo "Anzahl: $(printf '%s\n' "$names" | grep -c . || true)"
          echo
          echo "Erwartet fuer den Betrieb:"
          for want in N8N_BASE_URL N8N_API_KEY SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if printf '%s\n' "$names" | grep -qx "$want"; then
              echo "  [da]     $want"
            else
              echo "  [fehlt]  $want"
            fi
          done
